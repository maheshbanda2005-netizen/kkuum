name = "serverless-file-sharing-backend"
main = "src/index.js"
compatibility_date = "2023-10-01"

[vars]
CLOUDFLARE_ACCOUNT_ID = "YOUR_ACCOUNT_ID"
R2_BUCKET_NAME = "serverless-file-sharing-bucket"
# R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY should be set as secrets

[[kv_namespaces]]
binding = "FILE_METADATA"
id = "FILE_METADATA_ID" # Placeholder

[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "serverless-file-sharing-bucket"
