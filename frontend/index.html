<!doctype html>
<html lang="en">
  <head>
    <script>
      if (typeof window !== 'undefined' && !window.crypto.randomBytes) {
        window.crypto.randomBytes = (size) => {
          const arr = new Uint8Array(size);
          window.crypto.getRandomValues(arr);
          return arr;
        };
      }
    </script>
